# Copy into your private local config directory; do not add provider keys here.
# The service currently defaults to ~/.aegis/config.yaml.
provider: openrouter
model: openrouter/auto
project_root: /absolute/path/to/your/project
allowed_domains: []
max_request_bytes: 2000000
max_response_bytes: 8000000
require_local_auth: true
key_source: env
registry_checks: false
llm_guard_enabled: false
native_anthropic_enabled: false
native_gemini_enabled: false
mcp_enabled: false
a2a_enabled: false
custom_providers:
  # Custom providers must be trusted HTTPS OpenAI-compatible endpoints.
  # Keys are supplied separately, e.g. AEGIS_CUSTOM_VENDORX_API_KEY.
  - name: vendorx
    url: https://api.vendor.example/v1/chat/completions
    # Enable only for an upstream verified to implement the native Responses API.
    # responses_url: https://api.vendor.example/v1/responses
audit_path: /home/your-user/.aegis/audit.jsonl
token_path: /home/your-user/.aegis/local-token
