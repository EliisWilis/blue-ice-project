[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-ice-project"
version = "0.1.0"
description = "Blue Ice Project: local OpenAI-compatible privacy gateway for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Blue Ice Project contributors" }]
keywords = ["llm", "proxy", "privacy", "security", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "keyring>=25,<26",
]

[project.optional-dependencies]
llm-guard = ["llm-guard==0.3.16"]
mcp = ["mcp>=2.3,<3"]
a2a = ["a2a-sdk[fastapi]>=1.3,<2"]
protocols = ["mcp>=2.3,<3", "a2a-sdk[fastapi]>=1.3,<2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
blue-ice = "aegis.cli:main"
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
