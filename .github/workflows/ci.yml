name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests and Python checks
        run: |
          pytest
          python examples/offline_demo.py
          ruff check src tests examples/offline_demo.py
          ruff format --check src tests examples/offline_demo.py
          python -m compileall -q src tests examples/offline_demo.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli-node/package-lock.json

      - name: Build TypeScript terminal client
        working-directory: cli-node
        run: |
          npm ci
          npm run build
